[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tgv-darkint"
version = "0.2.0"
description = "Dark-web terminology and TTP trainer for analysts. Synthetic data only."
readme = "README.md"
dependencies = ["rich>=13"]
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "thegr8val" }]
keywords = ["osint", "threat-intelligence", "dark-web", "training", "mitre-attack", "blue-team"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Education",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/TheGr8Val/TGV-DarkINT"
Issues = "https://github.com/TheGr8Val/TGV-DarkINT/issues"

[project.scripts]
tgv-darkint = "tgv_darkint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tgv_darkint = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]
